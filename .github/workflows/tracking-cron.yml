name: BZ Bets Tracking Cron

on:
  schedule:
    # Four daily checkpoints (UTC). Each run refreshes model inputs first,
    # then snapshots predictions and grades completed games.
    - cron: "0 16,20,0,3 * * *"
  workflow_dispatch:

jobs:
  refresh-snapshot-and-grade:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh BZ Bets stats sheets
        env:
          BZ_BETS_URL: ${{ secrets.BZ_BETS_URL }}
          BZ_BETS_ADMIN_TOKEN: ${{ secrets.BZ_BETS_ADMIN_TOKEN }}
        run: |
          if [ -z "$BZ_BETS_URL" ] || [ -z "$BZ_BETS_ADMIN_TOKEN" ]; then
            echo "Tracking cron is installed but not activated. Add BZ_BETS_URL and BZ_BETS_ADMIN_TOKEN repository secrets."
            exit 0
          fi

          BASE_URL="${BZ_BETS_URL%/}"
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 120 \
            -X POST "$BASE_URL/admin/daily" \
            -H "X-Admin-Token: $BZ_BETS_ADMIN_TOKEN" \
            -H "Accept: application/json"

      - name: Snapshot predictions and grade results
        env:
          BZ_BETS_URL: ${{ secrets.BZ_BETS_URL }}
          BZ_BETS_ADMIN_TOKEN: ${{ secrets.BZ_BETS_ADMIN_TOKEN }}
        run: |
          if [ -z "$BZ_BETS_URL" ] || [ -z "$BZ_BETS_ADMIN_TOKEN" ]; then
            exit 0
          fi

          BASE_URL="${BZ_BETS_URL%/}"
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 120 \
            -X POST "$BASE_URL/admin/tracking" \
            -H "X-Admin-Token: $BZ_BETS_ADMIN_TOKEN" \
            -H "Accept: application/json"
